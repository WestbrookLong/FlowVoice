<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flow Voice</title>
    <style>
      :root {
        --bg: #050807;
        --panel: rgba(8, 16, 13, 0.92);
        --panel-strong: #0B1D14;
        --ink: #DDE7DF;
        --muted: #5B7062;
        --accent: #28F58D;
        --accent-strong: #7BFFB5;
        --danger: #c4533c;
        --line: rgba(40, 245, 141, 0.12);
        --shadow: rgba(0, 0, 0, 0.5);
        --input-font-size: 22px;
        --input-line-height: 1.36;
        --input-padding-y: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        min-height: 100dvh;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 0%, rgba(12, 255, 136, 0.32), transparent 18rem),
          radial-gradient(circle at 92% 12%, rgba(31, 164, 99, 0.18), transparent 16rem),
          linear-gradient(155deg, #050807 0%, #0B1D14 42%, #06100B 100%);
        font-family: "Aptos Display", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      }

      main {
        min-height: 100dvh;
        display: grid;
        padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }

      .shell {
        position: relative;
        display: grid;
        grid-template-rows: auto auto auto;
        gap: 16px;
        width: min(100%, 760px);
        margin: auto;
        overflow: hidden;
        border: 1px solid rgba(40, 245, 141, 0.22);
        border-radius: 34px;
        padding: 18px;
        background:
          linear-gradient(145deg, rgba(8, 16, 13, 0.96), rgba(11, 29, 20, 0.88)),
          var(--panel);
        box-shadow: 0 30px 90px var(--shadow);
      }

      .shell::before {
        content: "";
        position: absolute;
        inset: -36% 20% auto -20%;
        height: 280px;
        pointer-events: none;
        background: radial-gradient(circle, rgba(40, 245, 141, 0.58), transparent 65%);
        filter: blur(6px);
      }

      header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .eyebrow {
        width: fit-content;
        border: 1px solid rgba(40, 245, 141, 0.24);
        border-radius: 999px;
        padding: 4px 10px;
        color: var(--accent-strong);
        background: rgba(40, 245, 141, 0.12);
        font: 900 11px/1 "Segoe UI", sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      h1 {
        margin: 0;
        font: 600 18px/1 "Segoe UI", sans-serif;
        letter-spacing: -0.02em;
        color: #F0FFF5;
        white-space: nowrap;
      }

      .status {
        flex: 0 0 auto;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 9px 12px;
        color: var(--muted);
        background: rgba(8, 16, 13, 0.78);
        font: 800 12px/1.1 "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
        box-shadow: inset 0 1px 0 rgba(40, 245, 141, 0.08);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #5B7062;
        box-shadow: 0 0 8px rgba(91, 112, 98, 0.5);
      }

      .status[data-state="connected"] {
        color: #9CFCC4;
        background: rgba(40, 245, 141, 0.15);
      }

      .status[data-state="connected"] .dot {
        background: #28F58D;
        box-shadow: 0 0 14px rgba(40, 245, 141, 0.9);
      }

      .status[data-state="error"] {
        color: var(--danger);
        background: rgba(196, 83, 60, 0.1);
      }

      .status[data-state="error"] .dot {
        background: #c4533c;
        box-shadow: 0 0 8px rgba(196, 83, 60, 0.6);
      }

      .composer {
        position: relative;
        display: grid;
        min-height: 0;
      }

      textarea {
        width: 100%;
        height: calc((var(--input-font-size) * var(--input-line-height) * 3) + (var(--input-padding-y) * 2) + 2px);
        min-height: calc((var(--input-font-size) * var(--input-line-height) * 3) + (var(--input-padding-y) * 2) + 2px);
        max-height: calc((var(--input-font-size) * var(--input-line-height) * 3) + (var(--input-padding-y) * 2) + 2px);
        resize: none;
        overflow-y: auto;
        border: 1px solid rgba(40, 245, 141, 0.14);
        border-radius: 30px;
        outline: none;
        padding: var(--input-padding-y) 18px;
        color: var(--ink);
        background:
          linear-gradient(rgba(8, 16, 13, 0.86), rgba(8, 16, 13, 0.86)),
          radial-gradient(circle at 100% 0%, rgba(40, 245, 141, 0.22), transparent 16rem);
        box-shadow:
          inset 0 1px 0 rgba(40, 245, 141, 0.08),
          0 18px 48px rgba(0, 0, 0, 0.4);
        font: 500 var(--input-font-size)/var(--input-line-height) "LXGW WenKai", "STKaiti", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      textarea::placeholder {
        color: rgba(221, 231, 223, 0.34);
      }

      textarea:focus {
        border-color: rgba(40, 245, 141, 0.42);
        box-shadow:
          0 0 0 5px rgba(40, 245, 141, 0.22),
          0 18px 48px rgba(0, 0, 0, 0.4);
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      button {
        min-height: 54px;
        border: 1px solid var(--line);
        border-radius: 20px;
        color: var(--ink);
        background: rgba(8, 16, 13, 0.76);
        font: 900 16px/1 "Segoe UI", "PingFang SC", sans-serif;
        box-shadow: inset 0 1px 0 rgba(40, 245, 141, 0.08);
      }

      button.primary {
        border-color: rgba(40, 245, 141, 0.3);
        color: #041008;
        background: var(--accent);
        box-shadow: 0 0 28px rgba(40, 245, 141, 0.24);
      }

      @media (max-width: 430px) {
        .shell {
          border-radius: 28px;
          padding: 14px;
        }

        header {
          align-items: center;
        }

        .eyebrow {
          display: none;
        }

        .status {
          padding: 8px 10px;
        }

        textarea {
          border-radius: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell">
        <header>
          <div class="brand">
            <div class="eyebrow">LIVE INPUT</div>
            <h1>Flow Voice</h1>
          </div>
          <div id="status" class="status" data-state="idle">
          <span class="dot"></span>
        </div>
        </header>

        <div class="composer">
          <textarea id="input" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="开始输入"></textarea>
        </div>

        <div class="toolbar">
          <button id="clear" type="button">清空</button>
        </div>
      </section>
    </main>

    <script>
      const statusEl = document.querySelector("#status");
      const inputEl = document.querySelector("#input");
      const clearButton = document.querySelector("#clear");
      const params = new URLSearchParams(location.search);
      const token = params.get("token") || "";

      let ws = null;
      let seq = 0;
      let queue = [];
      let reconnectTimer = null;
      let lastSentText = "";
      let lastExplicitBackspaceAt = 0;

      function setStatus(text, state = "idle") {
        statusEl.dataset.state = state;
        if (state === "connected") {
          statusEl.innerHTML = '<span class="dot"></span>';
        } else {
          statusEl.innerHTML = text;
        }
      }

      function socketUrl() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        return `${protocol}//${location.host}/ws?token=${encodeURIComponent(token)}`;
      }

      function sendMessage(message) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          queue.push(message);
          setStatus("离线", "error");
          return;
        }
        ws.send(JSON.stringify(message));
      }

      function flushQueue() {
        const pending = queue;
        queue = [];
        for (const item of pending) {
          sendMessage(item);
        }
      }

      function syncNow() {
        if (inputEl.value === lastSentText) {
          return;
        }
        lastSentText = inputEl.value;
        sendMessage({
          type: "sync_text",
          token,
          seq: ++seq,
          text: inputEl.value,
        });
      }

      function resetSession() {
        sendMessage({
          type: "reset_session",
          token,
          seq: ++seq,
        });
      }

      function sendEnter() {
        sendMessage({
          type: "ops",
          token,
          seq: ++seq,
          ops: [{ type: "enter" }],
        });
      }

      function clearInputAfterEnter() {
        inputEl.value = "";
        lastSentText = "";
        resetSession();
      }

      function triggerEnterAndClear() {
        sendEnter();
        clearInputAfterEnter();
        requestAnimationFrame(() => inputEl.focus());
      }

      function maybeSendEnterAndClear(event) {
        const isKeyboardEnter = event.key === "Enter";
        const isInputLineBreak = event.inputType === "insertLineBreak" || event.inputType === "insertParagraph";
        if (!isKeyboardEnter && !isInputLineBreak) {
          return;
        }
        event.preventDefault();
        triggerEnterAndClear();
      }

      function syncOrHandleLineBreak() {
        const lineBreakIndex = inputEl.value.search(/\r?\n/);
        if (lineBreakIndex >= 0) {
          const textBeforeBreak = inputEl.value.slice(0, lineBreakIndex);
          if (textBeforeBreak !== lastSentText) {
            lastSentText = textBeforeBreak;
            sendMessage({
              type: "sync_text",
              token,
              seq: ++seq,
              text: textBeforeBreak,
            });
          }
          triggerEnterAndClear();
          return;
        }
        syncNow();
      }

      function sendExplicitBackspace() {
        sendMessage({
          type: "ops",
          token,
          seq: ++seq,
          ops: [{ type: "backspace", count: 1 }],
        });
      }

      function maybeSendEmptyBackspace(event) {
        const isKeyboardBackspace = event.key === "Backspace";
        const isInputBackspace = event.inputType === "deleteContentBackward";
        if (!isKeyboardBackspace && !isInputBackspace) {
          return;
        }
        if (inputEl.value.length > 0 || inputEl.selectionStart !== 0 || inputEl.selectionEnd !== 0) {
          return;
        }
        const now = performance.now();
        if (now - lastExplicitBackspaceAt < 80) {
          event.preventDefault();
          return;
        }
        lastExplicitBackspaceAt = now;
        event.preventDefault();
        sendExplicitBackspace();
      }

      function connect() {
        clearTimeout(reconnectTimer);
        if (ws) {
          ws.close();
        }

        setStatus("连接中", "idle");
        ws = new WebSocket(socketUrl());

        ws.addEventListener("open", () => {
          setStatus("在线", "connected");
          flushQueue();
          inputEl.focus();
        });

        ws.addEventListener("message", (event) => {
          try {
            const message = JSON.parse(event.data);
            if (message.type === "error") {
              setStatus("错误", "error");
            }
          } catch (_) {
            // Ignore non-JSON diagnostics.
          }
        });

        ws.addEventListener("close", () => {
          setStatus("断开", "error");
          reconnectTimer = setTimeout(connect, 1200);
        });

        ws.addEventListener("error", () => {
          setStatus("错误", "error");
        });
      }

      inputEl.addEventListener("keydown", maybeSendEmptyBackspace);
      inputEl.addEventListener("keydown", maybeSendEnterAndClear);
      inputEl.addEventListener("beforeinput", maybeSendEmptyBackspace);
      inputEl.addEventListener("beforeinput", maybeSendEnterAndClear);
      inputEl.addEventListener("input", syncOrHandleLineBreak);

      clearButton.addEventListener("click", () => {
        inputEl.value = "";
        lastSentText = "";
        resetSession();
        inputEl.focus();
      });

      
      connect();
    </script>
  </body>
</html>
